services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-content-machine
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - seo_data:/app/data
    environment:
      - NODE_ENV=production
      # Add other environment variables here if running locally with docker-compose
      # For Easypanel, configure them in the "Environment" tab

volumes:
  seo_data:
